<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1040px; height:1040px; overflow:hidden;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    background:linear-gradient(160deg,#fdf3f4 0%,#fbe9ec 45%,#f7f1e8 100%);
    position:relative; color:#3a3a45; }
  /* 桜の装飾 */
  .sakura { position:absolute; font-size:64px; color:#f2b8c6; opacity:.55; }
  .s1{top:36px;left:40px;} .s2{top:110px;right:70px;font-size:88px;opacity:.4;}
  .s3{bottom:180px;left:60px;font-size:52px;} .s4{bottom:60px;right:48px;font-size:72px;opacity:.45;}
  .circle { position:absolute; border-radius:50%; }
  .c1{width:260px;height:260px;background:#f8dfe5;top:-80px;right:-60px;opacity:.6;}
  .c2{width:180px;height:180px;background:#efe6d8;bottom:-50px;left:-40px;opacity:.7;}
  .frame { position:absolute; inset:26px; border:2px solid #caa96a; border-radius:18px; }
  .inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; text-align:center; padding:70px 60px 56px; }
  .shop { font-size:30px; letter-spacing:.35em; color:#8a6d3b; }
  .badge { margin-top:18px; background:#c85a72; color:#fff; font-family:"Hiragino Sans",sans-serif;
    font-size:30px; font-weight:700; letter-spacing:.2em; padding:10px 42px; border-radius:999px; }
  h1 { margin-top:26px; font-size:82px; line-height:1.25; letter-spacing:.06em; color:#4a3f52; }
  h1 .accent { color:#c85a72; }
  .benefits { margin-top:40px; width:100%; display:flex; gap:24px; font-family:"Hiragino Sans",sans-serif; }
  .card { flex:1; background:rgba(255,255,255,.85); border:1.5px solid #e6cfae; border-radius:16px; padding:28px 18px; }
  .card .who { font-size:26px; color:#8a6d3b; letter-spacing:.1em; }
  .card .num { margin-top:10px; font-size:56px; font-weight:800; color:#c85a72; line-height:1.1; }
  .card .num small { font-size:26px; font-weight:700; }
  .card .sub { margin-top:8px; font-size:22px; color:#666; }
  .gift { margin-top:30px; font-family:"Hiragino Sans",sans-serif; font-size:28px; color:#4a3f52;
    background:rgba(255,255,255,.7); border-radius:12px; padding:12px 30px; }
  .cta { margin-top:auto; font-family:"Hiragino Sans",sans-serif; font-size:32px; font-weight:700;
    color:#fff; background:#06C755; padding:18px 60px; border-radius:999px; letter-spacing:.05em; text-align:center; line-height:1.4; }
  .cta small { display:block; font-weight:500; font-size:21px; opacity:.95; }
</style>
</head>
<body>
  <div class="circle c1"></div><div class="circle c2"></div>
  <div class="sakura s1">❀</div><div class="sakura s2">❀</div><div class="sakura s3">❀</div><div class="sakura s4">❀</div>
  <div class="frame"></div>
  <div class="inner">
    <div class="shop">京呉服平田・京呉服好一</div>
    <div class="badge">NEW　はじまりました</div>
    <h1>お友達<span class="accent">紹介</span><br>プログラム</h1>
    <div class="benefits">
      <div class="card">
        <div class="who">ご紹介されたお友達</div>
        <div class="num">10,000<small>pt</small></div>
        <div class="sub">ご成約でプレゼント</div>
      </div>
      <div class="card">
        <div class="who">ご紹介者さま</div>
        <div class="num">最大10<small>%</small></div>
        <div class="sub">成約金額をポイント還元</div>
      </div>
    </div>
    <div class="gift">🎁 貯まったポイントはギフトカード交換・お買い物に</div>
    <div class="cta">公式LINEメニュー「友達紹介」から<small>詳しくは店舗スタッフまでお気軽に</small></div>
  </div>
</body>
</html>
